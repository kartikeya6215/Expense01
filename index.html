
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Expense Tracker</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #212529;
            --text-muted: #6c757d;
            --income-color: #2ec4b6;
            --expense-color: #e63946;
            --border-radius: 16px;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        header {
            margin-top: 10px;
        }

        header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
        }

        /* Dashboard Overview Cards */
        .balance-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            text-align: center;
        }

        .balance-card h3 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .balance-card .balance-amount {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            border-top: 1px solid #edf2f7;
            padding-top: 20px;
        }

        .stat-box text {
            font-size: 12px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 4px;
        }

        .stat-box span {
            font-size: 18px;
            font-weight: 600;
        }

        .stat-income { color: var(--income-color); }
        .stat-expense { color: var(--expense-color); }

        /* Navigation Tabs */
        .tabs {
            display: flex;
            background: #e9ecef;
            padding: 4px;
            border-radius: 12px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 10px;
            transition: var(--transition);
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* Forms */
        .form-section {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            font-size: 15px;
            background-color: #fafafa;
            outline: none;
            transition: var(--transition);
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #a8dadc;
            background-color: #fff;
        }

        button.btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--text-main);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        button.btn-submit:active {
            transform: scale(0.98);
        }

        /* History List */
        .history-section {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
        }

        .history-section h2 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .transaction-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 280px;
            overflow-y: auto;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-radius: 10px;
            background: #f8f9fa;
            font-size: 14px;
        }

        .tx-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .tx-title {
            font-weight: 600;
        }

        .tx-meta {
            font-size: 11px;
            color: var(--text-muted);
        }

        .tx-amount {
            font-weight: 700;
        }

        .tx-income .tx-amount { color: var(--income-color); }
        .tx-expense .tx-amount { color: var(--expense-color); }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Finances</h1>
            <p id="current-date">Today</p>
        </header>

        <div class="balance-card">
            <h3>Net Balance</h3>
            <div class="balance-amount" id="net-balance">$0.00</div>
            <div class="stats-grid">
                <div class="stat-box">
                    <text>Total Income</text>
                    <span class="stat-income" id="total-income">+$0.00</span>
                </div>
                <div class="stat-box">
                    <text>Total Expenses</text>
                    <span class="stat-expense" id="total-expense">-$0.00</span>
                </div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('expense')">Log Expense</button>
            <button class="tab-btn" onclick="switchTab('income')">Log Income</button>
        </div>

        <div id="expense-form-section" class="form-section active">
            <form id="expense-form" onsubmit="addExpense(event)">
                <div class="form-group">
                    <label for="exp-amount">Amount</label>
                    <input type="number" id="exp-amount" step="0.01" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label for="exp-desc">What did you spend on?</label>
                    <input type="text" id="exp-desc" placeholder="e.g., Coffee, Groceries" required>
                </div>
                <div class="form-group">
                    <label for="exp-type">Type</label>
                    <select id="exp-type">
                        <option value="Daily">Daily Expense</option>
                        <option value="Monthly">Monthly Bill/Subscription</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Add Expense</button>
            </form>
        </div>

        <div id="income-form-section" class="form-section">
            <form id="income-form" onsubmit="addIncome(event)">
                <div class="form-group">
                    <label for="inc-amount">Amount Received</label>
                    <input type="number" id="inc-amount" step="0.01" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label for="inc-source">Payer's Name / Source</label>
                    <input type="text" id="inc-source" placeholder="e.g., Company, John Doe" required>
                </div>
                <button type="submit" class="btn-submit">Add Income</button>
            </form>
        </div>

        <div class="history-section">
            <h2>Recent History</h2>
            <ul class="transaction-list" id="tx-history">
                </ul>
        </div>
    </div>

    <script>
        // Set Current Date Display
        const options = { weekday: 'long', month: 'short', day: 'numeric' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', options);

        // Core App Data State
        let transactions = JSON.parse(localStorage.getItem('minimal_tracker_txs')) || [];

        // Tab Switching Logic
        function switchTab(tabType) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(form => form.classList.remove('active'));

            if (tabType === 'expense') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('expense-form-section').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('income-form-section').classList.add('active');
            }
        }

        // Handle adding Expense
        function addExpense(e) {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('exp-amount').value);
            const description = document.getElementById('exp-desc').value.trim();
            const type = document.getElementById('exp-type').value;

            const transaction = {
                id: Date.now(),
                type: 'expense',
                tag: type, // Daily or Monthly
                amount: amount,
                title: description,
                date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
            };

            transactions.unshift(transaction);
            updateAppState();
            document.getElementById('expense-form').reset();
        }

        // Handle adding Income
        function addIncome(e) {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('inc-amount').value);
            const source = document.getElementById('inc-source').value.trim();

            const transaction = {
                id: Date.now(),
                type: 'income',
                tag: 'Received',
                amount: amount,
                title: `From: ${source}`,
                date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
            };

            transactions.unshift(transaction);
            updateAppState();
            document.getElementById('income-form').reset();
        }

        // Calculate Totals and Render Interface
        function updateAppState() {
            localStorage.setItem('minimal_tracker_txs', JSON.stringify(transactions));
            
            let totalIncome = 0;
            let totalExpense = 0;

            transactions.forEach(tx => {
                if (tx.type === 'income') totalIncome += tx.amount;
                if (tx.type === 'expense') totalExpense += tx.amount;
            });

            const netBalance = totalIncome - totalExpense;

            // Update Metric Text
            document.getElementById('net-balance').innerText = `$${netBalance.toFixed(2)}`;
            document.getElementById('total-income').innerText = `+$${totalIncome.toFixed(2)}`;
            document.getElementById('total-expense').innerText = `-$${totalExpense.toFixed(2)}`;

            renderHistory();
        }

        // Render Transaction History List
        function renderHistory() {
            const listElement = document.getElementById('tx-history');
            listElement.innerHTML = '';

            if (transactions.length === 0) {
                listElement.innerHTML = '<li class="empty-state">No transactions tracked yet</li>';
                return;
            }

            transactions.forEach(tx => {
                const li = document.createElement('li');
                li.className = `transaction-item tx-${tx.type}`;

                li.innerHTML = `
                    <div class="tx-details">
                        <span class="tx-title">${tx.title}</span>
                        <span class="tx-meta">${tx.date} • ${tx.tag}</span>
                    </div>
                    <span class="tx-amount">${tx.type === 'income' ? '+' : '-'}$${tx.amount.toFixed(2)}</span>
                `;
                listElement.appendChild(li);
            });
        }

        // Initial application setup load
        updateAppState();
    </script>
</body>
</html>
